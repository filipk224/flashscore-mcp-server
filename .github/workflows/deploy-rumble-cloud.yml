name: Build & Deploy to Rumble Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Rumble Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    # Activate by setting repository variable ENABLE_RUMBLE_DEPLOY=true
    if: ${{ vars.ENABLE_RUMBLE_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUMBLE_SSH_HOST }}
          username: ${{ secrets.RUMBLE_SSH_USER }}
          key: ${{ secrets.RUMBLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.RUMBLE_SSH_PORT || 22 }}
          script_stop: true
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            set -euo pipefail

            echo "=== Checking Docker installation ==="
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing via official script..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$(whoami)" || true
              # Start docker if needed
              sudo systemctl enable --now docker || sudo service docker start || true
              echo "Docker installed."
            else
              echo "Docker already present: $(docker --version)"
            fi

            # Ensure docker compose plugin is available
            if ! docker compose version >/dev/null 2>&1; then
              echo "docker compose plugin missing; attempting install..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker-compose-plugin || true
            fi

            # New group membership may not be active in this session; use sudo if needed
            DOCKER="docker"
            if ! docker info >/dev/null 2>&1; then
              DOCKER="sudo docker"
            fi

            echo "=== GitHub Container Registry login ==="
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | $DOCKER login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            else
              echo "No GHCR token provided. Pull will only succeed if the package is public."
              echo "Make the package public: GitHub → Packages → flashscore-mcp-server → Package settings → Change visibility."
            fi

            DEPLOY_DIR="/opt/flashscore-mcp"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown "$(whoami):$(whoami)" "$DEPLOY_DIR" 2>/dev/null || true
            cd "$DEPLOY_DIR"
            mkdir -p data

            if [ ! -f docker-compose.yml ]; then
              echo "Creating docker-compose.yml..."
              cat > docker-compose.yml << 'EOF'
            services:
              flashscore-mcp:
                image: ghcr.io/filipk224/flashscore-mcp-server:latest
                container_name: flashscore-mcp
                restart: unless-stopped
                ports:
                  - "8000:8000"
                environment:
                  - PORT=8000
                  - HOST=0.0.0.0
                  - FLASHSCORE_HEADLESS=true
                  - FLASHSCORE_MAX_CONCURRENT_PAGES=2
                volumes:
                  - ./data:/app/data
            EOF
              # Fix possible leading spaces from heredoc in some shells
              sed -i 's/^[[:space:]]*//' docker-compose.yml 2>/dev/null || true
            fi

            echo "=== Pulling latest image ==="
            $DOCKER compose pull

            echo "=== Recreating container ==="
            $DOCKER compose up -d --force-recreate --remove-orphans

            echo "=== Pruning unused images ==="
            $DOCKER image prune -f || true

            echo "=== Deployment finished ==="
            $DOCKER compose ps
        env:
          # Optional: set GHCR_PULL_TOKEN (PAT with read:packages).
          # If empty, image must be public on ghcr.io for pull to work.
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
