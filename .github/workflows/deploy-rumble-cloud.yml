name: Build & Deploy to Rumble Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Rumble Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_RUMBLE_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUMBLE_SSH_HOST }}
          username: ${{ secrets.RUMBLE_SSH_USER }}
          key: ${{ secrets.RUMBLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.RUMBLE_SSH_PORT || 22 }}
          script_stop: true
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            set -e

            echo "=== Ensure Docker is installed ==="
            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable --now docker || true
              sleep 3
            fi
            sudo docker --version

            echo "=== Ensure compose plugin ==="
            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq docker-compose-plugin || true
            fi
            sudo docker compose version

            echo "=== Open host firewall for TCP 8000 (ufw / iptables) ==="
            if command -v ufw >/dev/null 2>&1; then
              sudo ufw allow 8000/tcp || true
              sudo ufw status || true
            fi
            # Always ensure iptables ACCEPT for 8000 (covers non-ufw hosts)
            sudo iptables -C INPUT -p tcp --dport 8000 -j ACCEPT 2>/dev/null || \
              sudo iptables -I INPUT -p tcp --dport 8000 -j ACCEPT || true
            sudo iptables -L INPUT -n | head -20 || true

            echo "=== Free disk space (prune unused Docker data) ==="
            sudo docker system prune -a -f || true
            sudo docker builder prune -a -f || true
            df -h /

            echo "=== GHCR login ==="
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            else
              echo "No GHCR_PULL_TOKEN; using public package"
            fi

            DEPLOY_DIR=/opt/flashscore-mcp
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$(whoami):$(whoami)" "$DEPLOY_DIR" || true
            cd "$DEPLOY_DIR"

            echo "=== Write docker-compose.yml (no volumes) ==="
            echo '' | base64 -d > docker-compose.yml
            echo "--- docker-compose.yml content ---"
            cat docker-compose.yml
            echo "--- end ---"

            echo "=== Pull image ==="
            sudo docker compose pull

            echo "=== Start container ==="
            sudo docker compose up -d --force-recreate --remove-orphans

            echo "=== Status ==="
            sudo docker compose ps
            sudo docker compose logs --tail=40 || true

            echo "=== Health check (wait for app to bind) ==="
            sleep 20

            echo "--- docker ps ---"
            sudo docker ps -a --filter name=flashscore-mcp

            echo "--- container inspect (State / Ports) ---"
            sudo docker inspect flashscore-mcp --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} Error={{.State.Error}} OOM={{.State.OOMKilled}}' 2>/dev/null || true
            sudo docker port flashscore-mcp 2>/dev/null || true

            echo "--- listening on 8000 ---"
            sudo ss -tlnp | grep 8000 || sudo netstat -tlnp 2>/dev/null | grep 8000 || echo "ss/netstat: nothing on 8000"

            echo "--- local TCP connect test ---"
            python3 -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1',8000)); print('TCP_OK'); s.close()" 2>&1 || echo "TCP_FAIL"

            echo "--- local MCP initialize (Streamable HTTP) ---"
            # Plain GET is NOT valid for Streamable HTTP. Must POST initialize with correct Accept.
            curl -sS -D /tmp/mcp_headers.txt -o /tmp/mcp_body.txt -w "HTTP_CODE=%{http_code}\nTIME=%{time_total}s\n" \
              --connect-timeout 10 --max-time 30 \
              -X POST http://127.0.0.1:8000/mcp \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-healthcheck","version":"1.0"}}}' \
              || echo "curl_local_failed=$?"
            echo "--- response headers ---"
            head -c 800 /tmp/mcp_headers.txt 2>/dev/null || true
            echo
            echo "--- response body (first 600 chars) ---"
            head -c 600 /tmp/mcp_body.txt 2>/dev/null || true
            echo

            echo "--- public IP of this host (for endpoint URL) ---"
            PUBLIC_IP=$(curl -sS --connect-timeout 5 https://ifconfig.me 2>/dev/null || curl -sS --connect-timeout 5 https://api.ipify.org 2>/dev/null || hostname -I 2>/dev/null | awk '{print $1}')
            echo "PUBLIC_IP=${PUBLIC_IP}"
            echo "ENDPOINT=http://${PUBLIC_IP}:8000/mcp"
            echo "NOTE: Streamable HTTP requires POST with Accept: application/json, text/event-stream"
            echo "      Browser GET / curl without headers will look like a failure."

            echo "--- external-style MCP initialize via public IP (from VM) ---"
            if [ -n "$PUBLIC_IP" ]; then
              curl -sS -D /tmp/mcp_ext_h.txt -o /tmp/mcp_ext.txt -w "HTTP_CODE=%{http_code}\nTIME=%{time_total}s\n" \
                --connect-timeout 10 --max-time 30 \
                -X POST "http://${PUBLIC_IP}:8000/mcp" \
                -H "Content-Type: application/json" \
                -H "Accept: application/json, text/event-stream" \
                -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"deploy-healthcheck-ext","version":"1.0"}}}' \
                || echo "curl_public_failed=$?"
              head -c 400 /tmp/mcp_ext_h.txt 2>/dev/null || true
              echo
              head -c 400 /tmp/mcp_ext.txt 2>/dev/null || true
              echo
            fi

            echo "--- recent container logs ---"
            sudo docker logs --tail=60 flashscore-mcp 2>&1 || true

            echo "=== Deploy + health check complete ==="
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
