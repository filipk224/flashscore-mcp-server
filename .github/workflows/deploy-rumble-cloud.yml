name: Build & Deploy to Rumble Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Rumble Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_RUMBLE_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUMBLE_SSH_HOST }}
          username: ${{ secrets.RUMBLE_SSH_USER }}
          key: ${{ secrets.RUMBLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.RUMBLE_SSH_PORT || 22 }}
          script_stop: true
          envs: GHCR_TOKEN,GITHUB_ACTOR
          script: |
            echo "=== Ensure Docker is installed ==="
            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo systemctl enable --now docker || true
              sleep 3
            fi
            sudo docker --version

            echo "=== Ensure compose plugin ==="
            if ! sudo docker compose version >/dev/null 2>&1; then
              sudo apt-get update -qq || true
              sudo apt-get install -y -qq docker-compose-plugin || true
            fi
            sudo docker compose version

            echo "=== GHCR login ==="
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            else
              echo "No GHCR_PULL_TOKEN; using public package"
            fi

            DEPLOY_DIR=/opt/flashscore-mcp
            sudo mkdir -p "$DEPLOY_DIR/data"
            sudo chown -R "$(whoami):$(whoami)" "$DEPLOY_DIR" || true
            cd "$DEPLOY_DIR"

            echo "=== Write docker-compose.yml (clean via base64) ==="
            echo '' | base64 -d > docker-compose.yml
            echo "--- docker-compose.yml content ---"
            cat docker-compose.yml
            echo "--- end ---"

            echo "=== Pull image ==="
            sudo docker compose pull

            echo "=== Start container ==="
            sudo docker compose up -d --force-recreate --remove-orphans

            echo "=== Status ==="
            sudo docker compose ps
            sudo docker compose logs --tail=40 || true
            echo "=== Deploy complete ==="
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
