name: Build & Deploy to Rumble Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Rumble Cloud
    needs: build-and-push
    runs-on: ubuntu-latest
    # Activate by setting repository variable ENABLE_RUMBLE_DEPLOY=true
    if: ${{ vars.ENABLE_RUMBLE_DEPLOY == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.RUMBLE_SSH_HOST }}
          username: ${{ secrets.RUMBLE_SSH_USER }}
          key: ${{ secrets.RUMBLE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.RUMBLE_SSH_PORT || 22 }}
          script_stop: true
          envs: GHCR_TOKEN
          script: |
            set -euo pipefail

            echo "Logging into GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            DEPLOY_DIR="/opt/flashscore-mcp"
            if [ ! -d "$DEPLOY_DIR" ] || [ ! -f "$DEPLOY_DIR/docker-compose.yml" ]; then
              echo "ERROR: $DEPLOY_DIR/docker-compose.yml not found."
              echo "Create it once on the VM (see README) then re-run the workflow."
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "Pulling latest image..."
            docker compose pull

            echo "Recreating container..."
            docker compose up -d --force-recreate --remove-orphans

            echo "Pruning unused images..."
            docker image prune -f

            echo "Deployment finished. Status:"
            docker compose ps
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
