[project]
name = "flashscore-mcp-server"
version = "0.1.1"
description = "Private production MCP server for Flashscore.com - auto-adapt + IaaS ready"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "tenacity",
]
[project.scripts]
flashscore-mcp = "flashscore_mcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/flashscore_mcp"]
