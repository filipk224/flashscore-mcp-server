# Local testing of the IaaS / streamable-HTTP container
# Usage:
#   docker compose up --build
# MCP: http://localhost:8000/mcp
#
# Optional Cloudflare Tunnel (remotely-managed):
#   export CLOUDFLARE_TUNNEL_TOKEN=eyJ...
#   docker compose --profile tunnel up --build
# Dashboard public hostname must target http://flashscore-mcp:8000

services:
  flashscore-mcp:
    build: .
    image: flashscore-mcp-server:local
    container_name: flashscore-mcp
    ports:
      - "8000:8000"
    shm_size: "1gb"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - FLASHSCORE_HEADLESS=true
      - FLASHSCORE_MAX_CONCURRENT_PAGES=2
      - FLASHSCORE_MIN_DELAY_S=1.8
      - LOG_LEVEL=info
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flashscore-mcp-tunnel
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - flashscore-mcp
